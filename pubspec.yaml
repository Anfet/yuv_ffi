name: yuv_ffi
description: "High-performance YUV/BGRA image processing for Flutter via native C/FFI."
version: 0.1.1
homepage: https://github.com/Anfet/yuv_ffi
repository: https://github.com/Anfet/yuv_ffi
issue_tracker: https://github.com/Anfet/yuv_ffi/issues

environment:
  sdk: ^3.5.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
