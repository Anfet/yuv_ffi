name: yuv_ffi
description: "High-performance YUV/BGRA image processing for Flutter via native C/FFI."
version: 0.2.4
homepage: https://github.com/Anfet/yuv_ffi
repository: https://github.com/Anfet/yuv_ffi
issue_tracker: https://github.com/Anfet/yuv_ffi/issues

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  ffi: ^2.2.0

dev_dependencies:
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      web:
        pluginClass: YuvFfiWebPlugin
        fileName: yuv_ffi_web.dart
  # Package assets needed by Web WASM loader bootstrap.
  # The actual files (`yuv_ffi.js`, `yuv_ffi.wasm`) are generated into this
  # directory by `tool/wasm/build_wasm.sh`.
  assets:
    - assets/wasm/
