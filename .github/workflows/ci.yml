name: CI

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.jobs || 'full' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

on:
  push:
    branches:
      - "release/**"
      - main
      - "all/**"
      - "all+*/**"
      - "*+all/**"
      - "*+all+*/**"
      - "vm/**"
      - "vm+*/**"
      - "*+vm/**"
      - "*+vm+*/**"
      - "bindings/**"
      - "bindings+*/**"
      - "*+bindings/**"
      - "*+bindings+*/**"
      - "linux/**"
      - "linux+*/**"
      - "*+linux/**"
      - "*+linux+*/**"
      - "macos/**"
      - "macos+*/**"
      - "*+macos/**"
      - "*+macos+*/**"
      - "ios/**"
      - "ios+*/**"
      - "*+ios/**"
      - "*+ios+*/**"
      - "android/**"
      - "android+*/**"
      - "*+android/**"
      - "*+android+*/**"
      - "windows/**"
      - "windows+*/**"
      - "*+windows/**"
      - "*+windows+*/**"
      - "web/**"
      - "web+*/**"
      - "*+web/**"
      - "*+web+*/**"
      - "example/**"
      - "example+*/**"
      - "*+example/**"
      - "*+example+*/**"
    paths-ignore: ['**/*.md', 'doc/archive/**', 'doc/perf/**']
  workflow_dispatch:
    inputs:
      jobs:
        description: Job to run
        required: true
        type: choice
        options:
          - vm
          - bindings
          - linux
          - macos
          - ios
          - android
          - windows
          - example
          - web

jobs:
  analyze-and-test-vm:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'vm') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+vm/') || contains(format('+{0}', github.ref_name), '+vm+')) }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.38.10', '3.44.9']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Configure Windows build tools PATH
        shell: pwsh
        run: |
          $gitBashDirectory = 'D:\.important\Git\bin'
          $cmakeDirectory = 'D:\.important\android-sdk\cmake\3.22.1\bin'
          if (-not (Test-Path (Join-Path $gitBashDirectory 'bash.exe'))) {
            throw "Git Bash is missing: $gitBashDirectory"
          }
          if (-not (Test-Path (Join-Path $cmakeDirectory 'cmake.exe'))) {
            throw "CMake is missing: $cmakeDirectory"
          }
          $cmakeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}

      # `example/pubspec.yaml` declares `yuv_ffi: {path: ../}`, which pub's
      # automatic workspace discovery pulls into this resolution unless
      # --no-example opts it out. This job checks the root package's own
      # declared lower bound (3.38.10 here); example's own, higher SDK
      # minimum is covered separately by example-analyze-and-build.
      - name: Flutter pub get (root)
        run: flutter pub get --no-example

      # A bare `flutter analyze` walks the whole directory tree regardless of
      # --no-example above, so it still reaches example/ and fails there on
      # the package resolution this job deliberately skipped. Scoping to the
      # root package's own source and test directories is what this job is
      # actually meant to check; example's own analyze runs separately in
      # example-analyze-and-build, against its own, correctly resolved SDK.
      - name: Analyze (root)
        run: flutter analyze --no-fatal-infos lib test

      # Since YUV-06 the loader opens the library by its installed name, so the
      # build output is placed on the dynamic loader's search path instead of
      # the old native/src/build/ build-tree path. Building into a throwaway
      # directory and exporting LD_LIBRARY_PATH is what a real consumer's
      # install looks like; keeping the old in-tree path would have hidden a
      # packaging regression behind a green job.
      - name: Build native library
        shell: pwsh
        env:
          FLUTTER_VERSION: ${{ matrix.flutter-version }}
        run: |
          $nativeBuild = Join-Path $env:RUNNER_TEMP "native-build-$env:FLUTTER_VERSION"
          cmake -S src -B $nativeBuild -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with $LASTEXITCODE" }
          cmake --build $nativeBuild --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with $LASTEXITCODE" }
          $nativeDllDirectory = Join-Path $nativeBuild 'Release'
          if (-not (Test-Path (Join-Path $nativeDllDirectory 'yuv_ffi.dll'))) {
            throw "Native library was not produced in $nativeDllDirectory"
          }
          $nativeDllDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Unit tests
        run: flutter test

  # YUV-26: proves ffigen.yaml's allowlist is host-independent. libclang's
  # system headers differ between Windows and Linux, so a `functions.include`
  # / `structs.include` pattern that is accidentally too broad (or too
  # narrow) can generate identically on one host and diverge on the other
  # without either host reporting an error. Regenerating from a clean
  # checkout and diffing against the committed file is a stronger proof of
  # host-independence than re-deriving the expected symbol set by hand.
  bindings-regeneration:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'bindings') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+bindings/') || contains(format('+{0}', github.ref_name), '+bindings+')) }}
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Install libclang
        shell: bash
        run: |
          xcode_developer="$(xcode-select -p)"
          libclang="$xcode_developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/libclang.dylib"
          test -f "$libclang"
          echo "FFIGEN_LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Regenerate bindings
        run: flutter pub run ffigen --config ffigen.yaml

      - name: Audit generated bindings against Dart usage
        run: dart run tool/verify_bindings_audit.dart

      - name: Fail on any drift from the committed bindings
        run: git diff --exit-code -- ffigen.yaml lib/src/functions/bindings/yuv_ffi_bingings.dart

  # YUV-06: proves the package is loadable the way a real consumer loads it.
  # Both jobs build from a clean checkout and then assert twice over: a VM
  # smoke, which resolves the library by its installed name, and an app-runtime
  # smoke through `flutter drive` against the built desktop application, which
  # is the only place the loader's real per-platform branch runs. Neither suite
  # skips when the library is missing — a skipped native run and a passing one
  # used to look identical in the log, which is how broken Linux/macOS
  # packaging stayed green.
  linux-native-smoke:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'linux') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+linux/') || contains(format('+{0}', github.ref_name), '+linux+')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Report sanitizer toolchain versions
        run: |
          clang --version
          cmake --version

      - name: Configure sanitizer tests (Debug)
        run: |
          cmake -S . -B "$RUNNER_TEMP/sanitizer-build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang

      - name: Build sanitizer tests (Debug)
        run: cmake --build "$RUNNER_TEMP/sanitizer-build" --config Debug

      - name: Run sanitizer tests (Debug)
        run: ctest --test-dir "$RUNNER_TEMP/sanitizer-build" -C Debug --output-on-failure

      - name: Configure sanitizer tests (Release)
        run: |
          cmake -S . -B "$RUNNER_TEMP/sanitizer-build-release" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang

      - name: Build sanitizer tests (Release)
        run: cmake --build "$RUNNER_TEMP/sanitizer-build-release" --config Release

      - name: Run sanitizer tests (Release)
        run: ctest --test-dir "$RUNNER_TEMP/sanitizer-build-release" -C Release --output-on-failure

      - name: Report sanitizer case count
        run: "$RUNNER_TEMP/sanitizer-build/test_native/abi_sanitizer_test"

      # Installed name on the loader search path, never the CMake build tree:
      # native/src/build/libyuv_ffi.so does not exist in a published package.
      - name: Build and install native library
        shell: bash
        run: |
          cmake -S src -B "$RUNNER_TEMP/native-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/native-build" --config Release
          test -f "$RUNNER_TEMP/native-build/libyuv_ffi.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/native-build" >> "$GITHUB_ENV"

      - name: Packaging smoke
        run: flutter test test/native_packaging_smoke_test.dart --reporter expanded

      # The example app ships no linux/ runner directory, so the platform
      # folder is scaffolded here rather than committed: `flutter config` only
      # enables the toolchain, it does not create a missing platform.
      #
      # VIEW-01A: camera_desktop's linux/CMakeLists.txt does
      # `pkg_check_modules(GSTREAMER REQUIRED gstreamer-1.0 gstreamer-app-1.0
      # gstreamer-video-1.0)`. libgstreamer1.0-dev provides the first .pc file;
      # libgstreamer-plugins-base1.0-dev provides the app and video ones.
      - name: Build example (linux desktop)
        working-directory: example
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .
          flutter pub get
          flutter build linux --release

      # The VM smoke above resolves the library through LD_LIBRARY_PATH, which
      # is not how an installed app finds it. This runs the same assertions
      # inside the built application, where the plugin's own CMake install
      # rules are what must place the .so next to the runner.
      - name: App-runtime smoke (linux desktop)
        shell: bash
        run: |
          xvfb-run -a bash tool/ci/drive.sh integration_test/native_app_runtime_smoke_test.dart linux

      - name: Native correctness probes (linux desktop)
        shell: bash
        run: |
          shopt -s nullglob
          targets=(example/integration_test/*_native_test.dart)
          if (( ${#targets[@]} == 0 )); then
            echo 'No native integration-test targets were found.' >&2
            exit 1
          fi
          for target_path in "${targets[@]}"; do
            xvfb-run -a bash tool/ci/drive.sh "${target_path#example/}" linux
          done

  macos-native-smoke:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'macos') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+macos/') || contains(format('+{0}', github.ref_name), '+macos+')) }}
    # Self-hosted (yuv-self-hosted): faster than the GitHub-hosted macos-latest
    # runner, and gives a physical Mac for a later camera smoke on this job's
    # host. With SIP enabled on that Mac, dyld ignores DYLD_LIBRARY_PATH and
    # DYLD_FALLBACK_LIBRARY_PATH for the Dart VM's child test process (confirmed
    # by reproducing the failure directly on the runner's own host outside CI:
    # the dlopen search list it prints never even includes the DYLD_* directory).
    # Copying the built dylib next to the Dart SDK's own binaries is one of the
    # unconditional relative-to-executable search paths dlopen always tries, so
    # it resolves regardless of what SIP strips from the environment; confirmed
    # working on the same host before wiring it into this job.
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (root)
        run: flutter pub get

      # On Apple platforms the sources are linked into the pod target, so the
      # symbols live in the running process and there is no file to open. The
      # dylib built here is what `flutter test` (a plain VM process, not an app
      # bundle) resolves. DYLD_LIBRARY_PATH is kept for hosts where it works
      # (e.g. GitHub-hosted macos-latest); the copy next to the Dart SDK is
      # what actually resolves it on this self-hosted runner, where SIP strips
      # DYLD_* from the child test process.
      - name: Build and install native library
        shell: bash
        run: |
          cmake -S src -B "$RUNNER_TEMP/native-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/native-build" --config Release
          test -f "$RUNNER_TEMP/native-build/libyuv_ffi.dylib"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/native-build" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/native-build/libyuv_ffi.dylib" \
            "$FLUTTER_ROOT/bin/cache/artifacts/engine/darwin-x64/libyuv_ffi.dylib"

      - name: Packaging smoke
        run: flutter test test/native_packaging_smoke_test.dart --reporter expanded

      # The committed macOS runner builds the example through CocoaPods, which
      # is what actually compiles macos/Classes/*.c. Before YUV-06 the pod
      # target contained only a forwarder to a header, so no operation symbol
      # was ever built here.
      - name: Build example (macos desktop)
        working-directory: example
        shell: bash
        run: |
          flutter pub get
          flutter build macos --release

      # The required macOS evidence. The VM smoke above side-loads the dylib
      # through DYLD_LIBRARY_PATH and therefore never reaches the branch a real
      # app takes: `_openYuvLibrary` returns `DynamicLibrary.process()` on
      # macOS because the sources are compiled into the pod target. A pod
      # target that forwarded no operation sources at all — the pre-YUV-06
      # state — still passed the VM smoke through the side-loaded dylib, so
      # only this step can prove the pod target itself carries the symbols.
      #
      # DYLD_LIBRARY_PATH is deliberately NOT exported here: it is set for the
      # job via GITHUB_ENV above, and leaving it visible would let the app fall
      # back to the same side-loaded dylib and mask an empty pod target.
      - name: App-runtime smoke (macos desktop)
        shell: bash
        env:
          DYLD_LIBRARY_PATH: ''
        run: |
          bash tool/ci/drive.sh integration_test/native_app_runtime_smoke_test.dart macos

      - name: Native correctness probes (macos desktop)
        shell: bash
        env:
          DYLD_LIBRARY_PATH: ''
        run: |
          shopt -s nullglob
          targets=(example/integration_test/*_native_test.dart)
          if (( ${#targets[@]} == 0 )); then
            echo 'No native integration-test targets were found.' >&2
            exit 1
          fi
          for target_path in "${targets[@]}"; do
            bash tool/ci/drive.sh "${target_path#example/}" macos
          done

  # YUV-24/YUV-06: proves Android builds the shared CMake source list through
  # the NDK and then loads and invokes the packaged library in an emulator.
  # android/build.gradle wires externalNativeBuild's cmake.path straight at
  # ../src/CMakeLists.txt; the APK build exercises that list and the smoke
  # closes the runtime gap a successful Gradle build alone cannot prove.
  android-native-build:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'android') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+android/') || contains(format('+{0}', github.ref_name), '+android+')) }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Configure Windows build tools PATH
        shell: pwsh
        run: |
          $gitBashDirectory = 'D:\.important\Git\bin'
          $cmakeDirectory = 'D:\.important\android-sdk\cmake\3.22.1\bin'
          if (-not (Test-Path (Join-Path $gitBashDirectory 'bash.exe'))) {
            throw "Git Bash is missing: $gitBashDirectory"
          }
          if (-not (Test-Path (Join-Path $cmakeDirectory 'cmake.exe'))) {
            throw "CMake is missing: $cmakeDirectory"
          }
          $cmakeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Configure Android SDK
        shell: pwsh
        run: |
          $androidSdk = 'D:\.important\android-sdk'
          if (-not (Test-Path (Join-Path $androidSdk 'platform-tools\adb.exe'))) {
            throw "Android SDK is missing at $androidSdk"
          }
          "ANDROID_HOME=$androidSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$androidSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $androidSdk 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $androidSdk 'emulator') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Check app-runtime smoke formatting
        working-directory: example
        run: dart format --output=none --set-exit-if-changed integration_test/native_app_runtime_smoke_test.dart

      - name: Build example (android)
        working-directory: example
        run: flutter build apk --debug
      - name: Build ARMv7-only app-runtime smoke APK
        working-directory: example
        run: >
          flutter build apk --debug --target=integration_test/native_app_runtime_smoke_test.dart
          --target-platform android-arm --split-per-abi

      - name: Verify ARMv7-only APK contents
        working-directory: example
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apkPath = 'build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk'
          if (-not (Test-Path $apkPath)) { throw "ARMv7 APK is missing: $apkPath" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apkPath))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            $abis = @($entries | ForEach-Object {
              if ($_ -match '^lib/([^/]+)/') { $Matches[1] }
            } | Sort-Object -Unique)
            if ($abis.Count -ne 1 -or $abis[0] -ne 'armeabi-v7a') {
              throw "Expected only armeabi-v7a native libraries, found: $($abis -join ', ')"
            }
            if ($entries -notcontains 'lib/armeabi-v7a/libyuv_ffi.so') {
              throw 'ARMv7 APK does not contain libyuv_ffi.so'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Run Android smoke and correctness probes on Windows emulator
        shell: pwsh
        run: |
          $androidSdk = $env:ANDROID_SDK_ROOT
          $adb = Join-Path $androidSdk 'platform-tools\adb.exe'
          $emulator = Join-Path $androidSdk 'emulator\emulator.exe'
          if (-not (Test-Path $emulator)) { throw "Android emulator is missing: $emulator" }
          $avdNames = @(& $emulator -list-avds)
          if ($LASTEXITCODE -ne 0 -or $avdNames -notcontains 'Tablet') {
            throw 'The configured x86_64 API 35 AVD Tablet is unavailable.'
          }
          & $adb start-server
          if ($LASTEXITCODE -ne 0) { throw 'adb start-server failed' }
          $emulatorProcess = Start-Process -FilePath $emulator -ArgumentList @('-avd', 'Tablet', '-port', '5554', '-no-window', '-no-audio', '-no-boot-anim', '-no-snapshot', '-gpu', 'swiftshader_indirect') -WindowStyle Hidden -PassThru
          try {
            & $adb -s emulator-5554 wait-for-device
            if ($LASTEXITCODE -ne 0) { throw 'Android emulator did not connect to adb' }
            $deadline = (Get-Date).AddMinutes(5)
            do {
              $bootCompleted = (& $adb -s emulator-5554 shell getprop sys.boot_completed).Trim()
              if ($bootCompleted -eq '1') { break }
              if ((Get-Date) -gt $deadline) { throw 'Android emulator did not finish booting within 5 minutes' }
              Start-Sleep -Seconds 3
            } while ($true)
            & $adb -s emulator-5554 shell settings put global window_animation_scale 0
            & bash tool/ci/drive.sh integration_test/native_app_runtime_smoke_test.dart emulator-5554 --no-pub
            if ($LASTEXITCODE -ne 0) { throw "Android app-runtime smoke failed with $LASTEXITCODE" }
            $targets = Get-ChildItem -Path example/integration_test -Filter '*_native_test.dart' -File
            if ($targets.Count -eq 0) { throw 'No native integration-test targets were found.' }
            foreach ($target in $targets) {
              & bash tool/ci/drive.sh "integration_test/$($target.Name)" emulator-5554 --no-pub
              if ($LASTEXITCODE -ne 0) { throw "Android native correctness probe failed: $($target.Name), exit $LASTEXITCODE" }
            }
          } finally {
            & $adb -s emulator-5554 emu kill
          }

  # YUV-06 requires mobile build evidence on both platforms. Android is covered
  # by android-native-build through the NDK. This job separately proves the
  # unsigned device build and the simulator's real app-runtime path. The latter
  # is required because a clean first `flutter drive` can otherwise fail before
  # the Pods_Runner framework is materialized, without exercising the plugin.
  #
  # --no-codesign is what makes this runnable without provisioning profiles; it
  # skips signing only, not the compile and link of the pod target.
  ios-native-build:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'ios') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+ios/') || contains(format('+{0}', github.ref_name), '+ios+')) }}
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      # Flutter's first simulator build can invoke pod install and start the
      # app link before Pods_Runner has been materialized. Prepare that scheme
      # explicitly so a fresh checkout has one deterministic build path.
      - name: Install iOS pods
        working-directory: example/ios
        env:
          LANG: en_US.UTF-8
        run: pod install

      - name: Boot an available iPhone simulator
        id: ios-simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$simulator_id"
          test "$simulator_id" != "null"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build Pods-Runner for the simulator
        working-directory: example/ios
        shell: bash
        run: |
          xcodebuild -quiet \
            -workspace Runner.xcworkspace \
            -scheme Pods-Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.ios-simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build example (ios simulator, no codesign)
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign

      - name: App-runtime smoke (ios simulator)
        shell: bash
        run: |
          bash tool/ci/drive.sh integration_test/native_app_runtime_smoke_test.dart '${{ steps.ios-simulator.outputs.id }}' --no-pub

      - name: Native correctness probes (ios simulator)
        shell: bash
        run: |
          shopt -s nullglob
          targets=(example/integration_test/*_native_test.dart)
          if (( ${#targets[@]} == 0 )); then
            echo 'No native integration-test targets were found.' >&2
            exit 1
          fi
          for target_path in "${targets[@]}"; do
            bash tool/ci/drive.sh "${target_path#example/}" '${{ steps.ios-simulator.outputs.id }}' --no-pub
          done

      - name: Build example (ios device, no codesign)
        working-directory: example
        run: flutter build ios --debug --no-codesign

  windows-native-smoke:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'windows') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+windows/') || contains(format('+{0}', github.ref_name), '+windows+')) }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Configure Windows build tools PATH
        shell: pwsh
        run: |
          $gitBashDirectory = 'D:\.important\Git\bin'
          $cmakeDirectory = 'D:\.important\android-sdk\cmake\3.22.1\bin'
          if (-not (Test-Path (Join-Path $gitBashDirectory 'bash.exe'))) {
            throw "Git Bash is missing: $gitBashDirectory"
          }
          if (-not (Test-Path (Join-Path $cmakeDirectory 'cmake.exe'))) {
            throw "CMake is missing: $cmakeDirectory"
          }
          $cmakeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Build and expose native library
        shell: pwsh
        run: |
          $nativeBuild = Join-Path $env:RUNNER_TEMP 'yuv-native-build'
          cmake -S src -B $nativeBuild -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with $LASTEXITCODE" }
          cmake --build $nativeBuild --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with $LASTEXITCODE" }
          $nativeDllDirectory = Join-Path $nativeBuild 'Release'
          if (-not (Test-Path (Join-Path $nativeDllDirectory 'yuv_ffi.dll'))) {
            throw "Native library was not produced in $nativeDllDirectory"
          }
          $nativeDllDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run package tests without native skips
        run: flutter test --reporter expanded

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Build example (Windows desktop)
        working-directory: example
        run: flutter build windows --release

      - name: App-runtime smoke (Windows desktop)
        shell: pwsh
        run: |
          & bash tool/ci/drive.sh integration_test/native_app_runtime_smoke_test.dart windows --no-pub
          if ($LASTEXITCODE -ne 0) { throw "Windows app-runtime smoke failed with $LASTEXITCODE" }

      - name: Native correctness probes (Windows desktop)
        shell: pwsh
        run: |
          $targets = Get-ChildItem -Path example/integration_test -Filter '*_native_test.dart' -File
          if ($targets.Count -eq 0) { throw 'No native integration-test targets were found.' }
          foreach ($target in $targets) {
            & bash tool/ci/drive.sh "integration_test/$($target.Name)" windows --no-pub
            if ($LASTEXITCODE -ne 0) { throw "Windows native correctness probe failed: $($target.Name), exit $LASTEXITCODE" }
          }

  example-analyze-and-build:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'example') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+example/') || contains(format('+{0}', github.ref_name), '+example+')) }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        # The declared lower Flutter bound needs an application build, not only
        # package analysis and VM tests. Both entries build the same example.
        #
        # VIEW-01A: example/pubspec.yaml requires Dart >=3.11.0 (camera_desktop
        # 2.0.0's own constraint). 3.38.10 ships Dart 3.10.9 and fails `pub get`
        # here, so the low end of this matrix is 3.41.0 -- the first stable
        # Flutter release carrying Dart 3.11.0 -- rather than the package's own
        # minimum-SDK floor used by analyze-and-test-vm below, which never
        # touches example.
        flutter-version: ['3.41.0', '3.44.9']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Configure Windows build tools PATH
        shell: pwsh
        run: |
          $gitBashDirectory = 'D:\.important\Git\bin'
          $cmakeDirectory = 'D:\.important\android-sdk\cmake\3.22.1\bin'
          if (-not (Test-Path (Join-Path $gitBashDirectory 'bash.exe'))) {
            throw "Git Bash is missing: $gitBashDirectory"
          }
          if (-not (Test-Path (Join-Path $cmakeDirectory 'cmake.exe'))) {
            throw "CMake is missing: $cmakeDirectory"
          }
          $cmakeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Analyze (example)
        working-directory: example
        run: flutter analyze

      - name: Build Web (example)
        working-directory: example
        run: flutter build web

  # The package WASM loader needs Flutter's asset bundle. `flutter test --platform
  # chrome` does not serve that bundle, so every asset-dependent runtime test
  # belongs in example/integration_test and runs through flutter drive.
  wasm-web-integration:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'web') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+web/') || contains(format('+{0}', github.ref_name), '+web+')) }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Configure Windows build tools PATH
        shell: pwsh
        run: |
          $gitBashDirectory = 'D:\.important\Git\bin'
          $cmakeDirectory = 'D:\.important\android-sdk\cmake\3.22.1\bin'
          if (-not (Test-Path (Join-Path $gitBashDirectory 'bash.exe'))) {
            throw "Git Bash is missing: $gitBashDirectory"
          }
          if (-not (Test-Path (Join-Path $cmakeDirectory 'cmake.exe'))) {
            throw "CMake is missing: $cmakeDirectory"
          }
          $cmakeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Verify machine Chrome and ChromeDriver
        shell: pwsh
        run: |
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          $driver = 'D:\.projects\.tools\chromedriver-win64\chromedriver.exe'
          if (-not (Test-Path $chrome)) { throw "Chrome is missing: $chrome" }
          if (-not (Test-Path $driver)) { throw "ChromeDriver is missing: $driver" }
          $chromeVersion = (Get-Item $chrome).VersionInfo.ProductVersion
          $driverOutput = & $driver --version
          $driverExitCode = $LASTEXITCODE
          if ($driverExitCode -ne 0) { throw "ChromeDriver version check failed with exit code $driverExitCode" }
          $driverVersion = ($driverOutput | Select-Object -First 1) -replace '^ChromeDriver ', ''
          if ($chromeVersion.Split('.')[0] -ne $driverVersion.Split('.')[0]) {
            throw "Chrome $chromeVersion and ChromeDriver $driverVersion have different major versions"
          }
          Write-Host "Chrome: $chromeVersion"
          Write-Host "ChromeDriver: $driverVersion"
          "CHROME_EXECUTABLE=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHROMEDRIVER_EXE=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Flutter pub get (root)
        run: flutter pub get

      # This validates the two assets that checkout supplied, before the
      # build step below can replace them. `pub publish --dry-run` prints the
      # archive's file list, so the two searches prove they are package inputs
      # rather than merely files left in the repository.
      - name: Verify published package contains committed WASM
        shell: pwsh
        run: |
          foreach ($asset in @('assets/wasm/yuv_ffi.js', 'assets/wasm/yuv_ffi.wasm')) {
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -eq 0) {
              throw "WASM package asset is missing or empty: $asset"
            }
          }
          git restore --worktree -- example/windows/flutter/generated_plugin_registrant.cc example/windows/flutter/generated_plugin_registrant.h example/windows/flutter/generated_plugins.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore generated Windows plugin registrant files before package validation' }
          $logPath = Join-Path $env:RUNNER_TEMP 'publish-dry-run.log'
          $output = & flutter pub publish --dry-run 2>&1
          $publishExitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $logPath
          if ($publishExitCode -ne 0) { throw "pub publish dry-run exited $publishExitCode" }
          $dryRunOutput = [string]::Join([Environment]::NewLine, $output)
          if ($dryRunOutput -notmatch 'yuv_ffi\.js \(' -or $dryRunOutput -notmatch 'yuv_ffi\.wasm \(') {
            throw 'pub dry-run did not list both committed WASM assets'
          }

      - name: Install Emscripten SDK
        shell: pwsh
        run: |
          $emsdkRoot = 'D:\.projects\.tools\emsdk-3.1.74'
          if (-not (Test-Path (Join-Path $emsdkRoot 'emsdk.bat'))) {
            git clone https://github.com/emscripten-core/emsdk.git $emsdkRoot
            if ($LASTEXITCODE -ne 0) { throw "emsdk clone failed with $LASTEXITCODE" }
          }
          & (Join-Path $emsdkRoot 'emsdk.bat') install 3.1.74
          if ($LASTEXITCODE -ne 0) { throw "emsdk 3.1.74 install failed with $LASTEXITCODE" }
          & (Join-Path $emsdkRoot 'emsdk.bat') activate 3.1.74
          if ($LASTEXITCODE -ne 0) { throw "emsdk 3.1.74 activation failed with $LASTEXITCODE" }

      # Emscripten 3.1.74 is the locked reproduction input for this generated
      # pair. A byte-for-byte diff makes an uncommitted or stale published
      # module fail instead of testing only a replacement.
      - name: Rebuild and compare WASM artifacts
        shell: pwsh
        run: |
          $emsdkRoot = 'D:\.projects\.tools\emsdk-3.1.74'
          . (Join-Path $emsdkRoot 'emsdk_env.ps1')
          if ($LASTEXITCODE -ne 0) { throw "emsdk environment setup failed with $LASTEXITCODE" }
          & (Join-Path $emsdkRoot 'upstream\emscripten\emcc.bat') -v
          if ($LASTEXITCODE -ne 0) { throw "emcc version check failed with $LASTEXITCODE" }
          $gitBash = 'D:\.important\Git\bin\bash.exe'
          if (-not (Test-Path $gitBash)) { throw "Git Bash is missing: $gitBash" }
          & $gitBash --noprofile --norc -c 'sh ./tool/wasm/build_wasm.sh --profile release'
          if ($LASTEXITCODE -ne 0) { throw "WASM build failed with $LASTEXITCODE" }
          foreach ($asset in @('assets/wasm/yuv_ffi.js', 'assets/wasm/yuv_ffi.wasm')) {
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -eq 0) {
              throw "WASM artifact is missing or empty: $asset"
            }
          }
          git diff --exit-code -- assets/wasm/yuv_ffi.js assets/wasm/yuv_ffi.wasm
          if ($LASTEXITCODE -ne 0) { throw 'Committed WASM artifacts differ from the emsdk 3.1.74 Windows rebuild' }

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      # Every asset-dependent Web acceptance case runs here. `flutter drive`
      # takes one target at a time, so the suites are driven in a loop rather
      # than as a directory; an unset `set -e` would let a failing target pass
      # the job, so each exit status is checked explicitly.
      - name: Required Web integration gate
        working-directory: example
        shell: pwsh
        run: |
          $driverProcess = Start-Process -FilePath $env:CHROMEDRIVER_EXE -ArgumentList '--port=4444' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            $deadline = (Get-Date).AddSeconds(15)
            do {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4444/status' -TimeoutSec 2
                if ($status.value.ready) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            } while ((Get-Date) -lt $deadline)
            if (-not $ready) { throw 'ChromeDriver did not become ready on port 4444' }

            $targets = @(Get-ChildItem -Path integration_test -Filter '*_web_test.dart' -File | Sort-Object Name)
            if ($targets.Count -eq 0) { throw 'No Web integration-test targets were found.' }
            $failed = @()
            foreach ($target in $targets) {
              $targetPath = "integration_test/$($target.Name)"
              Write-Host "::group::$targetPath"
              & bash ../tool/ci/drive.sh $targetPath web-server --browser-name=chrome --headless
              if ($LASTEXITCODE -eq 0) { Write-Host "PASS $targetPath" }
              else { Write-Host "FAIL $targetPath"; $failed += $targetPath }
              Write-Host '::endgroup::'
            }
            if ($failed.Count -gt 0) { throw "Failed Web integration targets: $($failed -join ', ')" }
          } finally {
            if ($driverProcess -and -not $driverProcess.HasExited) { Stop-Process -Id $driverProcess.Id -Force }
          }

      # YUV-18: the full reference matrix (119 cases over test_pattern_512.png).
      # CI did not cover it at all -- the targets above are contract and
      # lifecycle suites, none of which compare against the reference images,
      # so a Web/native divergence like F-009 could only be caught by a manual
      # run. This step closes that gap.
      #
      # The shared drive helper requires both exit 0 and Flutter's terminal
      # "All tests passed" verdict. An earlier version of this step tried to
      # assert on the suite's own "YUV-12 summary: executed=... failed=..."
      # line, which was wrong --
      # debugPrint output from the browser does not reach drive's stdout, so
      # that line is never visible here even on a fully successful run, and
      # every run would fail. Only the failure output (expect() messages and
      # stack traces) is forwarded, which is what makes the exit code
      # meaningful: a deliberately broken web assertion was verified to turn
      # this job red (run 35832935455, FAIL wasm_bootstrap_test.dart).
      #
      # Consequence worth knowing: because the per-case debugPrint log is
      # invisible here, a failing matrix tells you THAT cases failed, not
      # which. Reproduce locally to get per-case ids.
      - name: Web reference matrix (YUV-12/YUV-18)
        working-directory: example
        shell: pwsh
        run: |
          $driverProcess = Start-Process -FilePath $env:CHROMEDRIVER_EXE -ArgumentList '--port=4444' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            $deadline = (Get-Date).AddSeconds(15)
            do {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4444/status' -TimeoutSec 2
                if ($status.value.ready) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            } while ((Get-Date) -lt $deadline)
            if (-not $ready) { throw 'ChromeDriver did not become ready on port 4444' }
            & bash ../tool/ci/drive.sh integration_test/reference_web_conversions_test.dart web-server --browser-name=chrome --headless
            if ($LASTEXITCODE -ne 0) { throw "Web reference matrix failed with $LASTEXITCODE" }
          } finally {
            if ($driverProcess -and -not $driverProcess.HasExited) { Stop-Process -Id $driverProcess.Id -Force }
          }
