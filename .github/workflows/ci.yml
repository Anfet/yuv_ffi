name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Analyze (root)
        run: flutter analyze

      # The FFI loader and the reference matrix both open
      # native/src/build/libyuv_ffi.so by that exact relative path, so the
      # library has to be built there rather than wherever CMake would default
      # to. Without it every native case skips and the guard that exists to
      # catch a fully-skipped run fails the job.
      - name: Build native library
        shell: bash
        run: |
          cmake -S src -B native/src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/src/build --config Release
          test -f native/src/build/libyuv_ffi.so

      - name: Unit tests
        run: flutter test

  example-analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Analyze (example)
        working-directory: example
        run: flutter analyze

      - name: Build Web (example)
        working-directory: example
        run: flutter build web

  # The package WASM loader needs Flutter's asset bundle. `flutter test --platform
  # chrome` does not serve that bundle, so every asset-dependent runtime test
  # belongs in example/integration_test and runs through flutter drive.
  wasm-web-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      # Both must come from the same install, or the driver refuses the session:
      # the stable channel briefly shipped chromedriver 153 against Chrome 152,
      # which failed with "This version of ChromeDriver only supports Chrome
      # version 153". Pinning one version keeps the pair consistent.
      - name: Setup Chrome and matching chromedriver
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: '152'
          install-chromedriver: true
          install-dependencies: true

      - name: Report the browser/driver pair
        shell: bash
        run: |
          echo "chrome:       ${{ steps.chrome.outputs.chrome-version }}"
          echo "chromedriver: ${{ steps.chrome.outputs.chromedriver-version }}"
          "${{ steps.chrome.outputs.chromedriver-path }}" --version

      - name: Install Emscripten SDK
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Build WASM artifacts
        shell: bash
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcc -v
          sh ./tool/wasm/build_wasm.sh --profile release
          test -f assets/wasm/yuv_ffi.js
          test -f assets/wasm/yuv_ffi.wasm

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      # Every asset-dependent Web acceptance case runs here. `flutter drive`
      # takes one target at a time, so the suites are driven in a loop rather
      # than as a directory; an unset `set -e` would let a failing target pass
      # the job, so each exit status is checked explicitly.
      - name: Required Web integration gate
        working-directory: example
        shell: bash
        run: |
          set -euo pipefail

          chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
          chromedriver_pid=$!
          trap 'cat /tmp/chromedriver.log; kill "$chromedriver_pid"' EXIT

          for _ in $(seq 1 10); do
            if curl --fail --silent http://127.0.0.1:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4444/status > /dev/null

          targets=(
            integration_test/wasm_bootstrap_test.dart
            integration_test/getbytes_contract_test.dart
            integration_test/padded_bgra_constructor_test.dart
            integration_test/image_cache_key_test.dart
            integration_test/wasm_loader_lifecycle_test.dart
          )

          failed=()
          for target in "${targets[@]}"; do
            echo "::group::$target"
            if xvfb-run -a flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$target" \
              -d web-server \
              --browser-name=chrome \
              --headless; then
              echo "PASS $target"
            else
              echo "FAIL $target"
              failed+=("$target")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -ne 0 ]; then
            echo "Failed Web integration targets:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
