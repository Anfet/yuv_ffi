name: CI

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.jobs || 'full' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

on:
  push:
    branches:
      - "release/**"
      - main
      - "all/**"
      - 'all\+*/**'
      - '*\+all/**'
      - '*\+all\+*/**'
      - "vm/**"
      - 'vm\+*/**'
      - '*\+vm/**'
      - '*\+vm\+*/**'
      - "bindings/**"
      - 'bindings\+*/**'
      - '*\+bindings/**'
      - '*\+bindings\+*/**'
      - "linux/**"
      - 'linux\+*/**'
      - '*\+linux/**'
      - '*\+linux\+*/**'
      - "macos/**"
      - 'macos\+*/**'
      - '*\+macos/**'
      - '*\+macos\+*/**'
      - "ios/**"
      - 'ios\+*/**'
      - '*\+ios/**'
      - '*\+ios\+*/**'
      - "android/**"
      - 'android\+*/**'
      - '*\+android/**'
      - '*\+android\+*/**'
      - "windows/**"
      - 'windows\+*/**'
      - '*\+windows/**'
      - '*\+windows\+*/**'
      - "web/**"
      - 'web\+*/**'
      - '*\+web/**'
      - '*\+web\+*/**'
      - "example/**"
      - 'example\+*/**'
      - '*\+example/**'
      - '*\+example\+*/**'
    paths-ignore: ['**/*.md', 'doc/archive/**', 'doc/perf/**']
  workflow_dispatch:
    inputs:
      jobs:
        description: Job to run
        required: true
        type: choice
        options:
          - vm
          - bindings
          - linux
          - macos
          - ios
          - android
          - windows
          - example
          - web

jobs:
  # YUV-26: proves ffigen.yaml's allowlist is host-independent. libclang's
  # system headers differ between Windows and Linux, so a `functions.include`
  # / `structs.include` pattern that is accidentally too broad (or too
  # narrow) can generate identically on one host and diverge on the other
  # without either host reporting an error. Regenerating from a clean
  # checkout and diffing against the committed file is a stronger proof of
  # host-independence than re-deriving the expected symbol set by hand.
  bindings-regeneration:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'bindings') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+bindings/') || contains(format('+{0}', github.ref_name), '+bindings+')) }}
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Install libclang
        shell: bash
        run: |
          xcode_developer="$(xcode-select -p)"
          libclang="$xcode_developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/libclang.dylib"
          test -f "$libclang"
          echo "FFIGEN_LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Regenerate bindings
        run: flutter pub run ffigen --config ffigen.yaml

      - name: Audit generated bindings against Dart usage
        run: dart run tool/verify_bindings_audit.dart

      - name: Fail on any drift from the committed bindings
        run: git diff --exit-code -- ffigen.yaml lib/src/functions/bindings/yuv_ffi_bingings.dart

  # YUV-06: proves the package is loadable the way a real consumer loads it.
  # Both jobs build from a clean checkout and then assert twice over: a VM
  # smoke, which resolves the library by its installed name, and an app-runtime
  # smoke through `flutter drive` against the built desktop application, which
  # is the only place the loader's real per-platform branch runs. Neither suite
  # skips when the library is missing — a skipped native run and a passing one
  # used to look identical in the log, which is how broken Linux/macOS
  # packaging stayed green.
  linux-native-smoke:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'linux') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+linux/') || contains(format('+{0}', github.ref_name), '+linux+')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Report sanitizer toolchain versions
        run: |
          clang --version
          cmake --version

      - name: Configure sanitizer tests (Debug)
        run: |
          cmake -S . -B "$RUNNER_TEMP/sanitizer-build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang

      - name: Build sanitizer tests (Debug)
        run: cmake --build "$RUNNER_TEMP/sanitizer-build" --config Debug

      - name: Run sanitizer tests (Debug)
        run: ctest --test-dir "$RUNNER_TEMP/sanitizer-build" -C Debug --output-on-failure

      - name: Configure sanitizer tests (Release)
        run: |
          cmake -S . -B "$RUNNER_TEMP/sanitizer-build-release" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang

      - name: Build sanitizer tests (Release)
        run: cmake --build "$RUNNER_TEMP/sanitizer-build-release" --config Release

      - name: Run sanitizer tests (Release)
        run: ctest --test-dir "$RUNNER_TEMP/sanitizer-build-release" -C Release --output-on-failure

      - name: Report sanitizer case count
        run: "$RUNNER_TEMP/sanitizer-build/test_native/abi_sanitizer_test"

      # Installed name on the loader search path, never the CMake build tree:
      # native/src/build/libyuv_ffi.so does not exist in a published package.
      - name: Build and install native library
        shell: bash
        run: |
          cmake -S src -B "$RUNNER_TEMP/native-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/native-build" --config Release
          test -f "$RUNNER_TEMP/native-build/libyuv_ffi.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/native-build" >> "$GITHUB_ENV"

      - name: Packaging smoke
        run: flutter test test/native_packaging_smoke_test.dart --reporter expanded

      # The example app ships no linux/ runner directory, so the platform
      # folder is scaffolded here rather than committed: `flutter config` only
      # enables the toolchain, it does not create a missing platform.
      #
      # VIEW-01A: camera_desktop's linux/CMakeLists.txt does
      # `pkg_check_modules(GSTREAMER REQUIRED gstreamer-1.0 gstreamer-app-1.0
      # gstreamer-video-1.0)`. libgstreamer1.0-dev provides the first .pc file;
      # libgstreamer-plugins-base1.0-dev provides the app and video ones.
      - name: Build example (linux desktop)
        working-directory: example
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .
          flutter pub get
          flutter build linux --release

      # The VM smoke above resolves the library through LD_LIBRARY_PATH, which
      # is not how an installed app finds it. This runs the same assertions
      # inside the built application, where the plugin's own CMake install
      # rules are what must place the .so next to the runner.
      - name: App-runtime smoke (linux desktop)
        shell: bash
        run: |
          xvfb-run -a bash tool/ci/drive.sh integration_test/native_app_runtime_smoke_test.dart linux

      - name: Native correctness probes (linux desktop)
        shell: bash
        run: |
          shopt -s nullglob
          targets=(example/integration_test/*_native_test.dart)
          if (( ${#targets[@]} == 0 )); then
            echo 'No native integration-test targets were found.' >&2
            exit 1
          fi
          for target_path in "${targets[@]}"; do
            xvfb-run -a bash tool/ci/drive.sh "${target_path#example/}" linux
          done

  # YUV-24/YUV-06: proves Android builds the shared CMake source list through
  # the NDK and then loads and invokes the packaged library in an emulator.
  # android/build.gradle wires externalNativeBuild's cmake.path straight at
  # ../src/CMakeLists.txt; the APK build exercises that list and the smoke
  # closes the runtime gap a successful Gradle build alone cannot prove.
  android-native-build:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.jobs == 'android') && (github.event_name != 'push' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || contains(format('+{0}', github.ref_name), '+all/') || contains(format('+{0}', github.ref_name), '+all+') || contains(format('+{0}', github.ref_name), '+android/') || contains(format('+{0}', github.ref_name), '+android+')) }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: 'D:\.important\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        run: bash tool/ci/scope_guard.sh

      - name: Configure Windows build tools PATH
        shell: pwsh
        run: |
          $gitBashDirectory = 'D:\.important\Git\bin'
          $cmakeDirectory = 'D:\.important\android-sdk\cmake\3.22.1\bin'
          if (-not (Test-Path (Join-Path $gitBashDirectory 'bash.exe'))) {
            throw "Git Bash is missing: $gitBashDirectory"
          }
          if (-not (Test-Path (Join-Path $cmakeDirectory 'cmake.exe'))) {
            throw "CMake is missing: $cmakeDirectory"
          }
          $cmakeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Configure Android SDK
        shell: pwsh
        run: |
          $androidSdk = 'D:\.important\android-sdk'
          if (-not (Test-Path (Join-Path $androidSdk 'platform-tools\adb.exe'))) {
            throw "Android SDK is missing at $androidSdk"
          }
          "ANDROID_HOME=$androidSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$androidSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $androidSdk 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $androidSdk 'emulator') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Check app-runtime smoke formatting
        working-directory: example
        run: dart format --output=none --set-exit-if-changed integration_test/native_app_runtime_smoke_test.dart

      - name: Build example (android)
        working-directory: example
        run: flutter build apk --debug
      - name: Build ARMv7-only app-runtime smoke APK
        working-directory: example
        run: >
          flutter build apk --debug --target=integration_test/native_app_runtime_smoke_test.dart
          --target-platform android-arm --split-per-abi

      - name: Verify ARMv7-only APK contents
        working-directory: example
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apkPath = 'build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk'
          if (-not (Test-Path $apkPath)) { throw "ARMv7 APK is missing: $apkPath" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apkPath))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            $abis = @($entries | ForEach-Object {
              if ($_ -match '^lib/([^/]+)/') { $Matches[1] }
            } | Sort-Object -Unique)
            if ($abis.Count -ne 1 -or $abis[0] -ne 'armeabi-v7a') {
              throw "Expected only armeabi-v7a native libraries, found: $($abis -join ', ')"
            }
            if ($entries -notcontains 'lib/armeabi-v7a/libyuv_ffi.so') {
              throw 'ARMv7 APK does not contain libyuv_ffi.so'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Run Android smoke and correctness probes on Windows emulator
        shell: pwsh
        run: |
          $androidSdk = $env:ANDROID_SDK_ROOT
          $adb = Join-Path $androidSdk 'platform-tools\adb.exe'
          $emulator = Join-Path $androidSdk 'emulator\emulator.exe'
          if (-not (Test-Path $emulator)) { throw "Android emulator is missing: $emulator" }
          $avdNames = @(& $emulator -list-avds)
          if ($LASTEXITCODE -ne 0 -or $avdNames -notcontains 'Tablet') {
            throw 'The configured x86_64 API 35 AVD Tablet is unavailable.'
          }
          & $adb start-server
          if ($LASTEXITCODE -ne 0) { throw 'adb start-server failed' }
          $emulatorProcess = Start-Process -FilePath $emulator -ArgumentList @('-avd', 'Tablet', '-port', '5554', '-no-window', '-no-audio', '-no-boot-anim', '-no-snapshot', '-gpu', 'swiftshader_indirect') -WindowStyle Hidden -PassThru
          try {
            & $adb -s emulator-5554 wait-for-device
            if ($LASTEXITCODE -ne 0) { throw 'Android emulator did not connect to adb' }
            $deadline = (Get-Date).AddMinutes(5)
            do {
              $bootCompleted = (& $adb -s emulator-5554 shell getprop sys.boot_completed).Trim()
              if ($bootCompleted -eq '1') { break }
              if ((Get-Date) -gt $deadline) { throw 'Android emulator did not finish booting within 5 minutes' }
              Start-Sleep -Seconds 3
            } while ($true)
            & $adb -s emulator-5554 shell settings put global window_animation_scale 0
            & bash tool/ci/drive.sh integration_test/native_app_runtime_smoke_test.dart emulator-5554 --no-pub
            if ($LASTEXITCODE -ne 0) { throw "Android app-runtime smoke failed with $LASTEXITCODE" }
            $targets = Get-ChildItem -Path example/integration_test -Filter '*_native_test.dart' -File
            if ($targets.Count -eq 0) { throw 'No native integration-test targets were found.' }
            foreach ($target in $targets) {
              & bash tool/ci/drive.sh "integration_test/$($target.Name)" emulator-5554 --no-pub
              if ($LASTEXITCODE -ne 0) { throw "Android native correctness probe failed: $($target.Name), exit $LASTEXITCODE" }
            }
          } finally {
            & $adb -s emulator-5554 emu kill
          }

  # YUV-06 requires mobile build evidence on both platforms. Android is covered
  # by android-native-build through the NDK. This job separately proves the
  # unsigned device build and the simulator's real app-runtime path. The latter
  # is required because a clean first `flutter drive` can otherwise fail before
  # the Pods_Runner framework is materialized, without exercising the plugin.
  #
  # --no-codesign is what makes this runnable without provisioning profiles; it
  # skips signing only, not the compile and link of the pod target.

