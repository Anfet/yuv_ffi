name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Analyze (root)
        run: flutter analyze

      # The FFI loader and the reference matrix both open
      # native/src/build/libyuv_ffi.so by that exact relative path, so the
      # library has to be built there rather than wherever CMake would default
      # to. Without it every native case skips and the guard that exists to
      # catch a fully-skipped run fails the job.
      - name: Build native library
        shell: bash
        run: |
          cmake -S src -B native/src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/src/build --config Release
          test -f native/src/build/libyuv_ffi.so

      - name: Unit tests
        run: flutter test

  example-analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Analyze (example)
        working-directory: example
        run: flutter analyze

      - name: Build Web (example)
        working-directory: example
        run: flutter build web

  wasm-web-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Install Emscripten SDK
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Build WASM artifacts
        shell: bash
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcc -v
          sh ./tool/wasm/build_wasm.sh --profile release
          test -f assets/wasm/yuv_ffi.js
          test -f assets/wasm/yuv_ffi.wasm

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Web parity gate (Chrome)
        shell: bash
        run: |
          required=(
            test/web/web_platform_sentinel.dart
            test/web/yuv_web_wasm_test.dart
            test/web/wasm_parity_conversions_test.dart
            test/web/wasm_parity_transforms_test.dart
            test/web/wasm_parity_edge_cases_test.dart
          )

          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Required web parity test is missing: $f"
              exit 1
            fi
          done

          for f in "${required[@]}"; do
            echo "Running web test: $f"
            xvfb-run -a flutter test --platform chrome --no-pub "$f" --reporter expanded
          done

  # Probe for YUV-02. The gate above cannot load the WASM assets, because the
  # `flutter test --platform chrome` server serves no asset bundle. This runs one
  # bootstrap test against a real app, where the bundle exists. It is allowed to
  # fail without failing the workflow: its only job right now is to answer
  # whether porting the four web suites here is worth doing.
  web-integration-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      # Both must come from the same install, or the driver refuses the session:
      # the stable channel briefly shipped chromedriver 153 against Chrome 152,
      # which failed with "This version of ChromeDriver only supports Chrome
      # version 153". Pinning one version keeps the pair consistent.
      - name: Setup Chrome and matching chromedriver
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: '152'
          install-chromedriver: true
          install-dependencies: true

      - name: Report the browser/driver pair
        shell: bash
        run: |
          echo "chrome:       ${{ steps.chrome.outputs.chrome-version }}"
          echo "chromedriver: ${{ steps.chrome.outputs.chromedriver-version }}"
          "${{ steps.chrome.outputs.chromedriver-path }}" --version

      - name: Install Emscripten SDK
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Build WASM artifacts
        shell: bash
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcc -v
          sh ./tool/wasm/build_wasm.sh --profile release
          test -f assets/wasm/yuv_ffi.js
          test -f assets/wasm/yuv_ffi.wasm

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: WASM bootstrap probe
        working-directory: example
        shell: bash
        run: |
          chromedriver --port=4444 &
          sleep 5
          xvfb-run -a flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/wasm_bootstrap_test.dart \
            -d web-server \
            --browser-name=chrome \
            --headless
