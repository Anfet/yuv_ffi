name: iOS CI

concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

on:
  push:
    branches:
      - "release/**"
      - main
      - "all/**"
      - 'all\+*/**'
      - '*\+all/**'
      - '*\+all\+*/**'
      - "ios/**"
      - 'ios\+*/**'
      - '*\+ios/**'
      - '*\+ios\+*/**'
  workflow_dispatch:

jobs:
  ios-native-build:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch scope
        shell: bash
        run: bash tool/ci/scope_guard.sh

      - name: Run iOS checks
        shell: bash
        run: bash tool/ci/ios.sh
