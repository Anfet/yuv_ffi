name: CI Android

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

on:
  push:
    branches:
      - "release/**"
      - main
      - "ci/**"
    paths-ignore: ["**/*.md", "doc/**", "tasks/**"]
  workflow_dispatch:

jobs:
  android:
    runs-on: [self-hosted, Windows, X64, android-emulator]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Android checks
        shell: pwsh
        run: ./tool/ci/android.ps1
