name: CI Windows

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

on:
  push:
    branches:
      - "release/**"
      - main
    tags:
      - "ci/all/**"
      - "ci/windows/**"
    paths-ignore: ["**/*.md", "doc/**", "tasks/**"]
  workflow_dispatch:

jobs:
  windows-native-smoke:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Windows CI
        shell: pwsh
        run: ./tool/ci/windows.ps1
